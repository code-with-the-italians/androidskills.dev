name = "androidskills-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-16"
workers_dev = true

[build]
command = "worker-build --release"

# D1 is deliberately configured only after account provisioning. The CI-only local
# emulator configuration lives in wrangler.d1.local.toml and has no deploy role.
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "androidskills-files"

# Queue and cron resource configuration belongs to the Cloudflare-authorized integration slice.
# The Rust entrypoints compile now, but they intentionally have no named resources in this slice.
