[package]
name = "androidskills-api-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
worker = { version = "=0.8.3", features = ["d1", "queue"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
