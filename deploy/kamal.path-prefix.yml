# Aspirational Kamal 2.x configuration for androidskills.dev.
#
# Use this only after you have verified that your Kamal version supports
# path_prefix routing to distinct services on the same domain. In this model
# kamal-proxy routes /api/* directly to the api service, while /gh/* falls
# through to the web service and is proxied to api by the Astro Node server.
# For a known-working topology today, see deploy/kamal.yml (fallback: all
# traffic to web, Astro proxies both /api/* and /gh/*).
#
# IMPORTANT — verify before first deploy:
# 1. kamal-proxy supports path_prefix routing to distinct roles on one domain.
# 2. The SQLite-safe no-overlap deploy option (deploy.rolling: false) exists.
# 3. /gh/webhooks is proxied by the web service to the api service.

service: androidskills
image: ghcr.io/code-with-the-italians/androidskills

servers:
  api:
    hosts:
      - <%= ENV["KAMAL_HOST"] %>
    env:
      clear:
        # kamal-proxy routes /api/* directly to api; only one trusted hop.
        TRUSTED_PROXY_COUNT: "1"
    # SQLite single-writer invariant: old container stops before new one starts.
    deploy:
      rolling: false
    # REVIEW: set the stop-grace option for your Kamal version high enough for
    # Ktor to drain and Litestream to write a final WAL checkpoint before the
    # new container takes over. Typical values are 10-30s; confirm exact syntax.
    proxy:
      path_prefix: /api
      healthcheck:
        path: /api/health
        interval: 5s
        timeout: 3s
      app_port: 8080
    options:
      # Persist SQLite and mirrored files on the host outside the container lifecycle.
      # REVIEW: confirm the volume syntax for your Kamal/Docker version.
      volume:
        - /var/lib/androidskills/data:/data
      # Expose the api service on a host-local port so the web container can
      # proxy /gh/* requests to it (kamal-proxy routes /gh/* to web).
      publish:
        - 127.0.0.1:8080:8080

  web:
    hosts:
      - <%= ENV["KAMAL_HOST"] %>
    env:
      clear:
        # Two trusted hops: client -> kamal-proxy -> Astro -> Ktor (Astro proxies /gh/*).
        TRUSTED_PROXY_COUNT: "2"
    proxy:
      path_prefix: /
      healthcheck:
        path: /
        interval: 5s
        timeout: 3s
      app_port: 4321

proxy:
  ssl: true
  host: androidskills.dev
  forward_headers: true

registry:
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] %>
  password: <%= ENV["KAMAL_REGISTRY_PASSWORD"] %>

builder:
  arch: amd64
  cache:
    type: registry
    image: ghcr.io/code-with-the-italians/androidskills-build-cache

env:
  clear:
    APP_VERSION: 0.0.1
    DATA_DIR: /data
    PUBLIC_BASE_URL: https://androidskills.dev
    API_URL: http://127.0.0.1:8080
    BOOTSTRAP_ADMIN_GITHUB_ID:
    SESSION_COOKIE_DOMAIN:
    SESSION_COOKIE_SECURE:
  secret:
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    - R2_ENDPOINT
    - R2_BACKUP_PATH
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_WEBHOOK_SECRET
    - LLM_BASE_URL
    - LLM_API_KEY
    - LLM_MODEL
