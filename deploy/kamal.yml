# Default Kamal configuration for androidskills.dev.
#
# This is the deployable topology today: kamal-proxy sends all traffic to the
# Astro web service, and the Astro Node server proxies /api/* and /gh/* to
# the Ktor api service. The api service is not exposed by kamal-proxy; it is
# reached from the web container via the host-published port 127.0.0.1:8080.
#
# Once kamal-proxy supports path-prefix routing to distinct services on one
# domain, deploy/kamal.path-prefix.yml can replace this file.

service: androidskills
image: ghcr.io/code-with-the-italians/androidskills

servers:
  web:
    hosts:
      - <%= ENV["KAMAL_HOST"] %>
    proxy:
      path_prefix: /
      healthcheck:
        path: /
        interval: 5s
        timeout: 3s
      app_port: 4321

  api:
    hosts:
      - <%= ENV["KAMAL_HOST"] %>
    # SQLite single-writer invariant: old container stops before new one starts.
    deploy:
      rolling: false
    # REVIEW: set stop-grace option high enough for Ktor drain + Litestream final checkpoint.
    # Not exposed by kamal-proxy; reached internally by the web container.
    # Publish a host-local port so the web container can proxy to it.
    options:
      publish:
        - 127.0.0.1:8080:8080
      volume:
        - /var/lib/androidskills/data:/data

proxy:
  ssl: true
  host: androidskills.dev
  forward_headers: true

registry:
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] %>
  password: <%= ENV["KAMAL_REGISTRY_PASSWORD"] %>

builder:
  arch: amd64
  cache:
    type: registry
    image: ghcr.io/code-with-the-italians/androidskills-build-cache

env:
  clear:
    APP_VERSION: 0.0.1
    DATA_DIR: /data
    PUBLIC_BASE_URL: https://androidskills.dev
    # web proxies to api via 127.0.0.1:8080, so there are two trusted hops:
    # client -> kamal-proxy -> Astro -> Ktor. api ignores this; it reads the
    # X-Forwarded-For appended by kamal-proxy (one hop, count=1).
    TRUSTED_PROXY_COUNT: "2"
    API_URL: http://127.0.0.1:8080
    BOOTSTRAP_ADMIN_GITHUB_ID:
    SESSION_COOKIE_DOMAIN:
    SESSION_COOKIE_SECURE:
  secret:
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    - R2_ENDPOINT
    - R2_BACKUP_PATH
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_WEBHOOK_SECRET
    - LLM_BASE_URL
    - LLM_API_KEY
    - LLM_MODEL
