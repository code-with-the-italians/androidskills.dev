name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Check Kotlin formatting
        working-directory: ./api
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessCheck --no-daemon
      - name: Run Detekt
        working-directory: ./api
        run: |
          chmod +x ./gradlew
          ./gradlew detekt --no-daemon
      - name: Run API tests
        working-directory: ./api
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      - name: Check formatting
        working-directory: ./web
        run: npm run format:check
      - name: Lint
        working-directory: ./web
        run: npm run lint
      - name: Astro check
        working-directory: ./web
        run: npm run check
      - name: TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit
      - name: Run markdown sanitizer tests
        working-directory: ./web
        run: npm test
      - name: Build Astro
        working-directory: ./web
        run: npm run build

  rust-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install pinned Worker tooling
        run: npm ci
      - name: Install the pinned Worker builder
        run: cargo install worker-build --version 0.8.3 --locked
      - name: Format and type-check the Wasm target
        run: |
          cargo fmt --check
          cargo check --locked --target wasm32-unknown-unknown
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked --lib
          python3 tests/schema_test.py
      - name: Apply and inspect migrations in the local D1 emulator
        run: |
          npx wrangler d1 migrations apply androidskills --local --config wrangler.d1.local.toml
          node tests/d1_catalogue_test.mjs
          node tests/d1_repository_contract_test.mjs
      - name: Exercise repositories through the local Worker D1 binding
        run: |
          npx wrangler dev --local --config wrangler.worker-d1.local.toml --port 8788 > repository-wrangler.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/__ci/repositories > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready:-}" != "1" ]; then
            cat repository-wrangler.log
            exit 1
          fi
          node tests/d1_repository_worker_test.mjs
          node tests/d1_public_read_worker_test.mjs
          node tests/d1_skill_read_worker_test.mjs
      - name: Build the Wasm Worker
        run: npx wrangler deploy --dry-run
      - name: Start the local Workers runtime
        run: |
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat wrangler.log
          exit 1
      - name: Run black-box contract fixtures against the Worker
        run: |
          CONTRACT_BASE_URL=http://127.0.0.1:8787 node tests/contract/run.mjs
          CONTRACT_BASE_URL=http://127.0.0.1:8787 node tests/unconfigured_public_read_worker_test.mjs

  ktor-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Start Ktor
        run: |
          chmod +x ./gradlew
          ./gradlew run --no-daemon > ktor.log 2>&1 &
          # This job has no Gradle cache from the API test job, so the first Ktor compile can
          # legitimately take longer than one minute before the server opens its health port.
          for attempt in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ktor.log
          exit 1
      - name: Run shared black-box contract fixtures against Ktor
        working-directory: ./api-rs
        run: CONTRACT_BASE_URL=http://127.0.0.1:8080 node tests/contract/run.mjs
